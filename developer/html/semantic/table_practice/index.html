<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Calculus Final Exams Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Yoandy Doble Herrera">
    <meta name="description" content="Table practices | freeCodeCamp project">
    <meta name="theme-color" content="#ffffff">
</head>

<body>
    <header>
        <h1>Calculus Final Exams Table</h1>
    </header>
    <main>
        <table role="grid" aria-labelledby="tbfinalexam">
            <caption id="tbfinalexam">Calculus Final Exam Grades</caption>
            <thead role="rowgroup">
                <tr>
                    <th role="columnheader">Last Name</th>
                    <th role="columnheader">First Name</th>
                    <th role="columnheader">Grade</th>
                </tr>
            </thead>
            <tbody role="rowgroup">
                <tr>
                    <td>Davis</td>
                    <td>Alex</td>
                    <td>54</td>
                </tr>
                <tr>
                    <td>Doe</td>
                    <td>Samantha</td>
                    <td>92</td>
                </tr>
                <tr>
                    <td>Rodriguez</td>
                    <td>Marcus</td>
                    <td>88</td>
                </tr>
                <tr>
                    <td>Thompson</td>
                    <td>Jane</td>
                    <td>77</td>
                </tr>
                <tr>
                    <td>Williams</td>
                    <td>Natalie</td>
                    <td>83</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">Average Grade</td>
                    <td>78.8</td>
                </tr>
            </tfoot>
        </table>
    </main>
    <footer></footer>
</body>

</html>
