<body>
    <header class="page-header">
        <h1>Drum Machine</h1>
        <div class="switch-mode">
            <button type="button" class="button-light-mode" aria-label="Activate light mode" aria-pressed="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-sun" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                    <path
                        d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
                </svg>
            </button>
            <button type="button" class="button-dark-mode" aria-label="Activate dark mode" aria-pressed="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-moon-stars" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008" />
                    <path d="M17 4a2 2 0 0 0 2 2a2 2 0 0 0 -2 2a2 2 0 0 0 -2 -2a2 2 0 0 0 2 -2" />
                    <path d="M19 11h2m-1 -1v2" />
                </svg>
            </button>
        </div>
    </header>
    <main>
        <div id="drum-machine">
            <section class="main-display">
                <h2 class="main-display_text">Display: </h2>
                <p id="display" aria-live="polite"></p>
                <article class="power-card">
                    <h3 class="power-card_status on">Power: On</h3>
                    <!-- Rounded switch -->
                    <label class="switch">
                        <input id="check-power" role="switch" type="checkbox" aria-label="Power switch" checked>
                        <span class="slider round"></span>
                    </label>
                </article>
            </section>
            <div id="pad-bank">
                <button type="button" id="heater-1" class="drum-pad" aria-label="Heater 1, key Q">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-piano" aria-hidden="true">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" />
                        <path d="M9 19v-6" />
                        <path d="M8 5v8h2v-8" />
                        <path d="M15 19v-6" />
                        <path d="M14 5v8h2v-8" />
                    </svg>
                    Q
                    <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3" class="clip" id="Q"></audio>
                </button>
                <button type="button" id="heater-2" class="drum-pad" aria-label="Heater 2, key W">

                </button>
                <button type="button" id="heater-3" class="drum-pad" aria-label="Heater 3, key E">

                </button>

                <button type="button" id="kick" class="drum-pad" aria-label="Kick, key X">

                </button>
                <button type="button" id="closed-hh" class="drum-pad" aria-label="Closed HH, key C">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-piano" aria-hidden="true">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" />
