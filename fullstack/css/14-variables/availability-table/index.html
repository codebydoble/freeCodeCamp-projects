<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Yoandy Doble Herrer">
    <meta name="description"
        content="Availability Calendar: Style to match your brand and configure to fit your use-case.">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="robots" content="index,follow">
    <meta property="og:site_name" content="Availability Table">
    <meta property="og:title" content="Availability Table">
    <meta property="og:description"
        content="Availability Calendar: Style to match your brand and configure to fit your use-case.">
    <meta property="og:url"
        content="https://www.freecodecamp.org/learn/responsive-web-design-v9/lab-availability-table/build-an-availability-table">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/images/availability-calenfar.webp">

    <meta name="twitter:card" content="summary">

    <meta name="twitter:site" content="@YoandyDoble">
    <meta name="twitter:creator" content="@YoandyDoble">
    <meta property="twitter:title" content="Availability Table">
    <meta property="twitter:description"
        content="Availability Calendar: Style to match your brand and configure to fit your use-case.">
    <meta property="twitter:image" content="assets/images/availability-calenfar.webp">

    <link rel="icon" type="image/png" href="assets/images/icons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">
    <link rel="shortcut icon" href="assets/images/icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icons/apple-touch-icon.png">
    <link rel="manifest" href="assets/images/icons/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Availability Table</title>
</head>

<body>
    <header class="page-header">
        <h1 class="center">Availability Calendar</h1>
    </header>
    <main class="main-content">
        <table>
            <caption>December 2025</caption>
            <thead>
                <tr class="sharp">
                    <th scope="col" class="center">Time</th>
                    <th scope="col" class="center">Sun</th>
                    <th scope="col" class="center">Mon</th>
                    <th scope="col" class="center">Tue</th>
                    <th scope="col" class="center">Wed</th>
                    <th scope="col" class="center">Thu</th>
                    <th scope="col" class="center">Fri</th>
                    <th scope="col" class="center">Sat</th>
                </tr>
            </thead>
            <tbody>
                <tr class="half">
                    <th scope="row" class="time">
                        <time datetime="08:00">08:00 AM</time>
                    </th>
                    <td class="available-1"></td>
                    <td class="available-5"></td>
                    <td class="available-1"></td>
                    <td class="available-3"></td>
                    <td class="available-0"></td>
                    <td class="available-2"></td>
                    <td class="available-3"></td>
                </tr>
                <tr class="sharp">
                    <th scope="row" class="time">
                        <time datetime="09:00">09:00 AM</time>
                    </th>
                    <td class="available-2"></td>
                    <td class="available-5"></td>
                    <td class="available-4"></td>
                    <td class="available-4"></td>
                    <td class="available-5"></td>
                    <td class="available-3"></td>
                    <td class="available-5"></td>
                </tr>
                <tr class="half">
                    <th scope="row" class="time">
                        <time datetime="10:00">10:00 AM</time>
                    </th>
                    <td class="available-1"></td>
                    <td class="available-5"></td>
                    <td class="available-1"></td>
                    <td class="available-2"></td>
                    <td class="available-1"></td>
                    <td class="available-2"></td>
                    <td class="available-5"></td>
                </tr>
                <tr class="sharp">
                    <th scope="row" class="time">
                        <time datetime="11:00">11:00 AM</time>
                    </th>
                    <td class="available-3"></td>
                    <td class="available-4"></td>
                    <td class="available-3"></td>
                    <td class="available-1"></td>
                    <td class="available-1"></td>
                    <td class="available-2"></td>
                    <td class="available-4"></td>
                </tr>
                <tr class="half">
                    <th scope="row" class="time">
                        <time datetime="01:00">01:00 PM</time>
                    </th>
                    <td class="available-2"></td>
                    <td class="available-2"></td>
                    <td class="available-3"></td>
                    <td class="available-4"></td>
                    <td class="available-4"></td>
                    <td class="available-5"></td>
                    <td class="available-0"></td>
                </tr>
                <tr class="sharp">
                    <th scope="row" class="time">
                        <time datetime="02:00">02:00 PM</time>
                    </th>
                    <td class="available-1"></td>
                    <td class="available-1"></td>
                    <td class="available-2"></td>
                    <td class="available-3"></td>
                    <td class="available-2"></td>
                    <td class="available-4"></td>
                    <td class="available-1"></td>
                </tr>
                <tr class="half">
                    <th scope="row" class="time">
                        <time datetime="03:00">03:00 PM</time>
                    </th>
                    <td class="available-0"></td>
                    <td class="available-3"></td>
                    <td class="available-4"></td>
                    <td class="available-3"></td>
                    <td class="available-3"></td>
                    <td class="available-1"></td>
                    <td class="available-4"></td>
                </tr>
                <tr class="sharp">
                    <th scope="row" class="time">
                        <time datetime="04:00">04:00 PM</time>
                    </th>
                    <td class="available-0"></td>
                    <td class="available-5"></td>
                    <td class="available-2"></td>
                    <td class="available-2"></td>
                    <td class="available-1"></td>
                    <td class="available-2"></td>
                    <td class="available-4"></td>
                </tr>
                <tr class="sharp">
                    <th scope="row" class="time">
                        <time datetime="05:00">05:00 PM</time>
                    </th>
                    <td class="available-0"></td>
                    <td class="available-5"></td>
                    <td class="available-4"></td>
                    <td class="available-1"></td>
                    <td class="available-3"></td>
                    <td class="available-3"></td>
                    <td class="available-0"></td>
                </tr>
            </tbody>
        </table>
        <div id="legend">
            <span class="center">Availability</span>
            <div id="legend-gradient"></div>
        </div>
    </main>
    <footer class="footer">
        <p class="footer-text">&copy; 2025 freeCodeCamp. All rights reserved. Made by <strong>@codebydoble</strong></p>
    </footer>
</body>

</html>
