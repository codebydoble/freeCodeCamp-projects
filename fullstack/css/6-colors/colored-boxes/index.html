<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colored Boxes</title>
    <meta name="description" content="Practice using CSS colors by designing boxes.">
    <meta name="author" content="Yoandy Doble Herrera">
    <meta name="robots" content="index,follow">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header aria-labelledby="main-header" class="header">
        <h1 id="main-header" class="header_title">PaletteVerse</h1>
    </header>
    <main class="main">
        <article class="article">
            <h2 class="article-title">Unleash your creativity with Top Color Palettes</h2>
            <p>Elevate your design with this Color Scheme Palette. Empower your creative journey.</p>
        </article>
        <div class="color-grid">
            <div class="color-box color1">
                <p>#A93F55</p>
            </div>
            <div class="color-box color2">
                <p>#968a8a</p>
            </div>
            <div class="color-box color3">
                <p>#4b0082</p>
            </div>
            <div class="color-box color4">
                <p>#754646</p>
            </div>
            <div class="color-box color5">
                <p>#B86969</p>
            </div>
        </div>
    </main>
    <footer>
        <p class="footer-text">&copy; freeCodeCamp, @codebydoble, 2025. All rights reserved.</p>
    </footer>
</body>

</html>
