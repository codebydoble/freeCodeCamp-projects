<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="author" content="Yoandy Doble Herrera">
    <meta name="description" content="Project focused on practicing Flexbox with poker cards. Made for freeCodeCamp.">
    <meta name="robots" content="index,follow">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="header">
        <h1>POKER'S HUB</h1>
        <p class="text">Start (free) <i class="fa-solid fa-play fa-beat links" aria-hidden="true"></i></p>
    </header>
    <main id="playing-cards">
        <div class="card card-heart">
            <div class="left">
                <p class="card-letter">A</p>
                <p class="card-figure">♥</p>
            </div>
            <div class="middle">
                <p class="card-figure_big">♥</p>
            </div>
            <div class="right">
                <p class="card-letter card-letter_reverse">A</p>
                <p class="card-figure">♥</p>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <p class="card-letter">A</p>
                <p class="card-figure">♠</p>
            </div>
            <div class="middle">
                <p class="card-figure_big">♠</p>
            </div>
            <div class="right">
                <p class="card-letter card-letter_reverse">A</p>
                <p class="card-figure">♠</p>
            </div>
        </div>
        <div class="card card-diamond">
            <div class="left">
                <p class="card-letter">A</p>
                <p class="card-figure">♦</p>
            </div>
            <div class="middle">
                <p class="card-figure_big">♦</p>
            </div>
            <div class="right">
                <p class="card-letter card-letter_reverse">A</p>
                <p class="card-figure">♦</p>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <p class="card-letter">A</p>
                <p class="card-figure">♣</p>
            </div>
            <div class="middle">
                <p class="card-figure_big">♣</p>
            </div>
            <div class="right">
                <p class="card-letter card-letter_reverse">A</p>
                <p class="card-figure">♣</p>
            </div>
        </div>
        <div class="card card-diamond">
            <div class="left">
                <p class="card-letter">3</p>
                <p class="card-figure">♦</p>
            </div>
            <div class="middle">
                <p class="card-figure_middle">♦</p>
                <p class="card-figure_middle">♦</p>
                <p class="card-figure_middle">♦</p>
            </div>
            <div class="right">
                <p class="card-letter card-letter_reverse">3</p>
                <p class="card-figure">♦</p>
            </div>
        </div>
        <div class="card card-heart">
            <div class="left">
                <p class="card-letter">4</p>
                <p class="card-figure">♥</p>
            </div>
            <div class="middle">
                <div class="middle-container middle-container_top">
                    <p class="card-figure_middle card-figure_middle_one">♥</p>
                    <p class="card-figure_middle">♥</p>
                </div>
                <div class="middle-container">
                    <p class="card-figure_middle card-figure_middle_one">♥</p>
                    <p class="card-figure_middle">♥</p>
                </div>
            </div>
            <div class="right">
                <p class="card-letter card-letter_reverse">4</p>
                <p class="card-figure">♥</p>
            </div>
        </div>
    </main>
    <footer>
        <p class="text">&copy; 2025 freeCodeCamp. Made with <i class="fa-solid fa-heart fa-beat"></i> by
            <strong>codebydoble</strong>
        </p>
    </footer>
</body>

</html>
