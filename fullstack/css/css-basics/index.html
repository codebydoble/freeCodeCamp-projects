<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullstack CSS</title>
    <meta name="author" content="Yoandy Doble Herrera">
    <meta name="description"
        content="The following lectures are all about CSS. You will learn what CSS is and its role on the web.">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/fullstack/css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Main Heading</h1>
    <div class="container">
        <p>First</p>
        <div>
            <p>Second</p>
        </div>
        <div>
            <p>Third</p>
        </div>
    </div>
    <figure>
        <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg"
            alt="A cute orange cat lying on its back." />
        <figcaption>A cute orange cat lying on its back.</figcaption>
    </figure>
    <div class="section-blog">
        <h2>Subheading</h2>
        <p>First paragraph.</p>
        <p>Second paragraph.</p>
        <p>Third paragraph.</p>
        <p>Another paragraph element</p>
    </div>

    <p class="text-description">Paragraph one</p>
    <p class="text-description">Paragraph two</p>
    <p class="text-description">Paragraph three</p>

    <span>Paragraph one</span>
    <p>Paragraph two</p>
    <span>Paragraph three</span>
</body>

</html>
