<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project Build a House Painting for freeCodeCamp.">
    <meta name="author" content="Yoandy Doble Herrera">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="robots" content="index,follow">
    <title>House Painting</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <section class="main-section_sun">
        <h1 class="main-heading">Asteroid</h1>
    </section>
    <main class="main" aria-labelledby="house">
        <div id="house" class="house">
            <div id="chimney" class="chimney"></div>
            <div id="roof" class="roof">
                <div class="roof-left"></div>
                <div class="roof-right"></div>
            </div>
            <div id="window-1" class="window-1">
                <div class="top-glass1">
                    <div class="window-1_glass1"></div>
                    <div class="window-1_glass2"></div>
                </div>
                <div class="bottom-glass1">
                    <div class="window-1_glass3"></div>
                    <div class="window-1_glass4"></div>
                </div>
            </div>
            <div id="window-2" class="window-2">
                <div class="top-glass2">
                    <div class="window-2_glass1"></div>
                    <div class="window-2_glass2"></div>
                </div>
                <div class="bottom-glass2">
                    <div class="window-2_glass3"></div>
                    <div class="window-2_glass4"></div>
                </div>
            </div>
            <div id="door" class="door">
                <div class="door-key"></div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p class="footer-text">&copy; 2025 freeCodeCamp. All rigths reserved. Made by <strong>@codebydoble</strong></p>
    </footer>
</body>

</html>
